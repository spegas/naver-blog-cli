# 원작성자: jjorae <raehyeok.cho@gmail.com> (2026-08-27) / Johnhyeon <whdqja216772@gmail.com>
# 출처: https://github.com/Johnhyeon/naver-blog-mcp
# 수정: 송중호 (2026-09-22) — MCP 서버 의존성/진입점 제거, CLI 전용으로 변경
#      패키지/폴더명을 naver_blog_mcp -> naver_blog_cli 로 변경 (mcp 단어 제거)

[project]
name = "naver-blog-cli"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
description = "네이버 블로그에 서식·이미지 포함 글을 작성하는 CLI (Playwright 기반)"
dependencies = ["playwright>=1.55.0"]

[project.scripts]
naver-blog-cli = "naver_blog_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naver_blog_cli"]
